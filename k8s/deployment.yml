apiVersion: apps/v1
kind: Deployment

metadata:
    name: task-manager-deployment
    
spec:
  replicas: 2

  selector:
    matchLabels:
      app: task-manager-app

  template:
    metadata:
      labels:
        app: task-manager-app

    spec:
      containers:
        - name: task-manager
          image:  chaitanyaaaa/task-manager:latest
          ports:
            - containerPort: 3000

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
        
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5  
              
